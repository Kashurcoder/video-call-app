<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearline — Video Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --radius: 14px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
  }

  /* ===== Themes ===== */
  [data-theme="midnight"] {
    --bg: #0f1220;
    --bg-elevated: #171b2e;
    --bg-elevated-2: #1e2338;
    --text: #eef0fb;
    --text-dim: #9599b8;
    --accent: #e8926c;
    --accent-text: #1a1206;
    --border: #2a2f48;
    --ok: #6fcf97;
    --busy: #e8926c;
  }
  [data-theme="dusk"] {
    --bg: #1c1526;
    --bg-elevated: #251c33;
    --bg-elevated-2: #2f2440;
    --text: #f2ecf7;
    --text-dim: #ab9dc0;
    --accent: #e0a3d0;
    --accent-text: #241521;
    --border: #3a2c4e;
    --ok: #8fd6c4;
    --busy: #e0a3d0;
  }
  [data-theme="daylight"] {
    --bg: #f6f3ee;
    --bg-elevated: #ffffff;
    --bg-elevated-2: #efe9df;
    --text: #221d17;
    --text-dim: #746a5c;
    --accent: #b1502f;
    --accent-text: #fff8f2;
    --border: #e4ddd0;
    --ok: #2f8a5c;
    --busy: #b1502f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    transition: background .3s ease, color .3s ease;
  }

  /* ===== Name entry screen ===== */
  #nameScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 28px;
    padding: 20px;
  }

  .brand {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand span { color: var(--accent); }

  .tagline {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: -18px;
  }

  .entry-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  input[type="text"] {
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-family: var(--font-body);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  button {
    font-family: var(--font-body);
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-weight: 600;
    transition: transform .12s ease, opacity .12s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    padding: 12px 16px;
    font-size: 15px;
  }
  .btn-primary:hover { opacity: 0.92; }

  .theme-picker {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.active { border-color: var(--text); }
  .swatch-midnight { background: linear-gradient(135deg, #171b2e, #e8926c); }
  .swatch-dusk { background: linear-gradient(135deg, #251c33, #e0a3d0); }
  .swatch-daylight { background: linear-gradient(135deg, #f6f3ee, #b1502f); }

  /* ===== Main app layout ===== */
  #app {
    display: none;
    height: 100vh;
    grid-template-columns: 280px 1fr;
  }
  #app.active { display: grid; }

  /* Sidebar */
  #sidebar {
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 22px 18px;
  }

  .sidebar-header {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 4px;
  }
  .sidebar-header span { color: var(--accent); }

  .sidebar-sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }

  .section-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
    font-weight: 500;
  }

  #memberList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow-y: auto;
  }

  .member-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-elevated-2);
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid transparent;
  }

  .member-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    min-width: 0;
  }
  .member-info span.name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ok);
    flex-shrink: 0;
  }
  .dot.busy { background: var(--busy); }

  .call-btn {
    background: var(--accent);
    color: var(--accent-text);
    padding: 6px 12px;
    font-size: 12px;
    flex-shrink: 0;
  }
  .call-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .sidebar-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }

  /* Stage (video area) */
  #stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: var(--bg-elevated-2);
  }

  #stagePlaceholder {
    position: absolute;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 20px;
  }

  #localVideoWrap {
    position: absolute;
    bottom: 100px;
    right: 24px;
    width: 160px;
    height: 120px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    background: #000;
  }
  #localVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror, feels natural for self view */
  }

  #callStatus {
    position: absolute;
    top: 20px;
    left: 24px;
    background: rgba(0,0,0,0.45);
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  #callStatus.active { display: flex; }
  #callTimer { font-variant-numeric: tabular-nums; opacity: 0.8; }

  /* Controls */
  #controls {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 12px;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 40px;
    backdrop-filter: blur(6px);
  }
  #controls.active { display: flex; }

  .ctrl-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.2); }
  .ctrl-btn.off { background: rgba(255,255,255,0.9); color: #111; }
  .ctrl-btn.end-call { background: #d9534f; }
  .ctrl-btn.end-call:hover { background: #c9433f; }

  @media (max-width: 640px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    #localVideoWrap { width: 100px; height: 76px; bottom: 90px; right: 14px; }
  }
</style>
</head>
<body data-theme="midnight">

  <!-- Name entry -->
  <div id="nameScreen">
    <div>
      <div class="brand">near<span>line</span></div>
      <div class="tagline">a private line, just for two</div>
    </div>
    <div class="entry-card">
      <input type="text" id="nameInput" placeholder="What should we call you?">
      <button class="btn-primary" id="joinBtn">Join</button>
    </div>
    <div class="theme-picker">
      <div class="swatch swatch-midnight active" data-theme="midnight" title="Midnight"></div>
      <div class="swatch swatch-dusk" data-theme="dusk" title="Dusk"></div>
      <div class="swatch swatch-daylight" data-theme="daylight" title="Daylight"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app">
    <div id="sidebar">
      <div class="sidebar-header">near<span>line</span></div>
      <div class="sidebar-sub" id="whoAmI"></div>

      <div class="section-label">Online</div>
      <div id="memberList"></div>

      <div class="sidebar-footer">
        <div class="theme-picker">
          <div class="swatch swatch-midnight active" data-theme="midnight" title="Midnight"></div>
          <div class="swatch swatch-dusk" data-theme="dusk" title="Dusk"></div>
          <div class="swatch swatch-daylight" data-theme="daylight" title="Daylight"></div>
        </div>
      </div>
    </div>

    <div id="stage">
      <div id="stagePlaceholder">Pick someone to call</div>
      <video id="remoteVideo" autoplay playsinline style="display:none;"></video>

      <div id="callStatus">
        <span id="callStatusText">Calling…</span>
        <span id="callTimer"></span>
      </div>

      <div id="localVideoWrap" style="display:none;">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

      <div id="controls">
        <button class="ctrl-btn" id="muteBtn" title="Mute">🎤</button>
        <button class="ctrl-btn" id="camBtn" title="Camera">📷</button>
        <button class="ctrl-btn end-call" id="endBtn" title="End call">✕</button>
      </div>
    </div>
  </div>

<script>
  const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

  const nameScreen = document.getElementById('nameScreen');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const appEl = document.getElementById('app');
  const whoAmI = document.getElementById('whoAmI');
  const memberListDiv = document.getElementById('memberList');

  const stagePlaceholder = document.getElementById('stagePlaceholder');
  const localVideo = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const localVideoWrap = document.getElementById('localVideoWrap');
  const controls = document.getElementById('controls');
  const callStatus = document.getElementById('callStatus');
  const callStatusText = document.getElementById('callStatusText');
  const callTimer = document.getElementById('callTimer');

  const muteBtn = document.getElementById('muteBtn');
  const camBtn = document.getElementById('camBtn');
  const endBtn = document.getElementById('endBtn');

  let myId = null, myName = null;
  let localStream = null;
  let peerConnection = null;
  let currentCallTarget = null;
  let members = [];
  let timerInterval = null;
  let callSeconds = 0;
  let micOn = true, camOn = true;

  const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  // ---- Theme switching ----
  document.querySelectorAll('.swatch').forEach(sw => {
    sw.onclick = () => {
      const theme = sw.dataset.theme;
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.theme === theme));
    };
  });

  // ---- Join flow ----
  joinBtn.onclick = async () => {
    const name = nameInput.value.trim();
    if (!name) return;
    myName = name;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (e) {
      alert("Camera/mic access is needed to join a call.");
      return;
    }
    localVideo.srcObject = localStream;

    ws.send(JSON.stringify({ type: "join", name: myName }));

    nameScreen.style.display = "none";
    appEl.classList.add('active');
    whoAmI.textContent = `Signed in as ${myName}`;
  };
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });

  // ---- Signaling ----
  ws.onmessage = async (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "your_id") { myId = data.id; return; }

    if (data.type === "member_list") {
      members = data.members;
      renderMembers();
      return;
    }

    if (data.type === "offer") {
      currentCallTarget = data.from;
      const caller = members.find(m => m.id === data.from);
      setCallStatus(`Incoming call from ${caller ? caller.name : 'someone'}…`);
      await ensurePeerConnection();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      ws.send(JSON.stringify({ ...answer, to: currentCallTarget }));
      sendStatus("in-call");
      enterCallUI();
    } else if (data.type === "answer") {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
      setCallStatus("Connected");
      startTimer();
    } else if (data.type === "candidate") {
      try { await peerConnection.addIceCandidate(data.candidate); } catch (e) {}
    } else if (data.type === "hangup") {
      endCall(false);
    }
  };

  function sendStatus(status) {
    ws.send(JSON.stringify({ type: "status", status }));
  }

  // ---- Member list rendering ----
  function renderMembers() {
    memberListDiv.innerHTML = "";
    const others = members.filter(m => m.id !== myId);

    if (others.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = "color:var(--text-dim); font-size:13px; padding:8px 2px;";
      empty.textContent = "Waiting for someone to join…";
      memberListDiv.appendChild(empty);
      return;
    }

    others.forEach(member => {
      const row = document.createElement('div');
      row.className = 'member-row';

      const info = document.createElement('div');
      info.className = 'member-info';
      const busy = member.status === 'in-call';
      info.innerHTML = `<span class="dot ${busy ? 'busy' : ''}"></span><span class="name">${member.name}</span>`;
      row.appendChild(info);

      const btn = document.createElement('button');
      btn.className = 'call-btn';
      btn.textContent = busy ? 'Busy' : 'Call';
      btn.disabled = busy || !!currentCallTarget;
      btn.onclick = () => startCall(member.id);
      row.appendChild(btn);

      memberListDiv.appendChild(row);
    });
  }

  // ---- WebRTC ----
  async function ensurePeerConnection() {
    if (peerConnection) return;
    peerConnection = new RTCPeerConnection(config);

    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.onicecandidate = (event) => {
      if (event.candidate && currentCallTarget) {
        ws.send(JSON.stringify({ type: "candidate", candidate: event.candidate, to: currentCallTarget }));
      }
    };

    peerConnection.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.style.display = "block";
      stagePlaceholder.style.display = "none";
    };

    peerConnection.onconnectionstatechange = () => {
      if (peerConnection && (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed')) {
        endCall(false);
      }
    };
  }

  async function startCall(targetId) {
    currentCallTarget = targetId;
    const target = members.find(m => m.id === targetId);
    setCallStatus(`Calling ${target ? target.name : ''}…`);
    enterCallUI();

    await ensurePeerConnection();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    ws.send(JSON.stringify({ ...offer, to: targetId }));
    sendStatus("in-call");
  }

  function enterCallUI() {
    localVideoWrap.style.display = "block";
    controls.classList.add('active');
    callStatus.classList.add('active');
  }

  function setCallStatus(text) { callStatusText.textContent = text; }

  function startTimer() {
    callSeconds = 0;
    updateTimerText();
    timerInterval = setInterval(() => { callSeconds++; updateTimerText(); }, 1000);
  }
  function updateTimerText() {
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    callTimer.textContent = `${m}:${s}`;
  }

  // ---- Controls ----
  muteBtn.onclick = () => {
    if (!localStream) return;
    micOn = !micOn;
    localStream.getAudioTracks().forEach(t => t.enabled = micOn);
    muteBtn.textContent = micOn ? '🎤' : '🔇';
    muteBtn.classList.toggle('off', !micOn);
  };

  camBtn.onclick = () => {
    if (!localStream) return;
    camOn = !camOn;
    localStream.getVideoTracks().forEach(t => t.enabled = camOn);
    camBtn.textContent = camOn ? '📷' : '📵';
    camBtn.classList.toggle('off', !camOn);
  };

  endBtn.onclick = () => endCall(true);

  function endCall(notifyPeer) {
    if (notifyPeer && currentCallTarget) {
      ws.send(JSON.stringify({ type: "hangup", to: currentCallTarget }));
    }
    if (peerConnection) { peerConnection.close(); peerConnection = null; }
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

    remoteVideo.style.display = "none";
    remoteVideo.srcObject = null;
    stagePlaceholder.style.display = "block";
    localVideoWrap.style.display = "none";
    controls.classList.remove('active');
    callStatus.classList.remove('active');

    currentCallTarget = null;
    sendStatus("available");
    renderMembers();
  }
</script>
</body>
</html>
